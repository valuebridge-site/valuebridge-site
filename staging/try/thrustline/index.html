<style>
/* Layout: navy rail (sidebar) + working canvas; collapses to a top bar under 760px */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface2:#EBEEF7; --ink:#0B1B33; --muted:#56647F; --line:#DCE1EE;
  --rail:#0B2D5B; --rail-ink:#DCE6F7; --rail-active:#163F78;
  --blue:#0067DB; --teal:#00957F; --purple:#6A3DF0; --amber:#B86E00; --bad:#C93434; --good:#0B8A5F;
  --blue-soft:#E3EEFF; --teal-soft:#DDF5F0; --purple-soft:#ECE6FF; --amber-soft:#FFF1DC; --bad-soft:#FDE7E7;
  --shadow:0 1px 2px rgba(11,45,91,.06),0 6px 20px rgba(11,45,91,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09121F; --surface:#101C30; --surface2:#16243C; --ink:#E6ECF7; --muted:#97A4BF; --line:#22324E;
  --rail:#060E1A; --rail-ink:#C9D6EE; --rail-active:#13284A;
  --blue:#4C9DFF; --teal:#2FD3B8; --purple:#A487FF; --amber:#F2AE48; --bad:#FF7A7A; --good:#43D19C;
  --blue-soft:#14294A; --teal-soft:#0F3132; --purple-soft:#241C47; --amber-soft:#35270F; --bad-soft:#3A1A1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09121F; --surface:#101C30; --surface2:#16243C; --ink:#E6ECF7; --muted:#97A4BF; --line:#22324E;
  --rail:#060E1A; --rail-ink:#C9D6EE; --rail-active:#13284A;
  --blue:#4C9DFF; --teal:#2FD3B8; --purple:#A487FF; --amber:#F2AE48; --bad:#FF7A7A; --good:#43D19C;
  --blue-soft:#14294A; --teal-soft:#0F3132; --purple-soft:#241C47; --amber-soft:#35270F; --bad-soft:#3A1A1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.85rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,#00C2A8,#0078FF,#7C4DFF,#00C2A8);display:grid;place-items:center}
.brand-mark::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--rail);box-shadow:0 0 0 3px #fff inset}
.brand b{font-family:var(--f-display);font-size:1.2rem;color:#fff;display:block;line-height:1}
.brand small{font-size:.7rem;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--rail-active);color:#fff}
.nav a .k{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;opacity:.5}
.nav svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;font-size:.75rem;opacity:.65;padding:0 8px}

.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted);min-width:0;flex:1;max-width:360px}
.search kbd,.kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--surface2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
a{color:var(--blue)}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary,a.btn.teal{color:#fff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:.65rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h .grow{flex:1}
.grid{display:grid;gap:18px}
.g-today{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

.example{display:flex;gap:10px;align-items:center;background:var(--purple-soft);border:1px solid color-mix(in srgb,var(--purple) 30%,transparent);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:.88rem;flex-wrap:wrap}
.example b{color:var(--purple)}

/* Quick add */
.qa{display:flex;flex-direction:column;gap:8px}
.qa-row{display:flex;gap:8px}
.qa input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 14px;font-size:.97rem}
.qa input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:22px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:600;white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.purple{background:var(--purple-soft);color:var(--purple)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* Today hero */
.hero{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.hero .grow{flex:1;min-width:240px}
.hero .date{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.cap{min-width:260px;flex:1;max-width:420px}
.cap-bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.cap-bar span{display:block;height:100%}
.cap-meta{display:flex;justify-content:space-between;font-size:.8rem;margin-top:6px}

/* Timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:6px}
.tl-item{display:grid;grid-template-columns:74px 4px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:9px}
.tl-item:hover{background:var(--surface2)}
.tl-item .t{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right}
.tl-item .bar{align-self:stretch;border-radius:4px}
.tl-item .ttl{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tl-item .sub{font-size:.78rem;color:var(--muted)}
.tl-item.past{opacity:.5}
.tl-item.done .ttl{text-decoration:line-through;color:var(--muted)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--bad);font-family:var(--f-mono);font-size:.72rem}
.nowline::after{content:"";height:2px;background:var(--bad);flex:1;border-radius:2px}

/* Tasks */
.trow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow:hover{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;margin-top:2px;padding:0}
.check.p1{border-color:var(--bad)} .check.p2{border-color:var(--amber)} .check.p3{border-color:var(--blue)}
.check.on{background:var(--good);border-color:var(--good)}
.check.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.trow .title{font-weight:600;overflow-wrap:anywhere}
.trow.done .title{text-decoration:line-through;color:var(--muted)}
.trow .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.trow .acts{display:flex;gap:2px;opacity:.55}
.trow:hover .acts{opacity:1}
.group-h{display:flex;align-items:baseline;gap:8px;margin:14px 0 4px}
.group-h:first-child{margin-top:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.84rem;font-weight:600;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quad{border-radius:12px;padding:12px;border:1px solid var(--line);min-height:160px;min-width:0}
.quad h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.q1{background:var(--bad-soft)} .q2{background:var(--blue-soft)} .q3{background:var(--amber-soft)} .q4{background:var(--surface2)}

/* Calendar */
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cal{display:grid;min-width:640px;position:relative}
.cal.days1{min-width:0}
.cal-head{display:grid;position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-head div{padding:8px 6px;text-align:center;font-size:.8rem;color:var(--muted);border-left:1px solid var(--line)}
.cal-head div:first-child{border-left:0}
.cal-head b{display:block;font-family:var(--f-display);font-size:1.25rem;color:var(--ink);line-height:1.1}
.cal-head .today b{color:#fff;background:var(--blue);border-radius:8px;width:fit-content;margin:0 auto;padding:0 7px}
[hidden]{display:none!important}
.cal-head .capmini{height:5px;padding:0;border:0;border-radius:3px;background:var(--surface2);margin:6px 8px 0;overflow:hidden}
.cal-head .capmini span{display:block;height:100%}
.cal-body{display:grid;position:relative;height:620px;overflow-y:auto}
.cal-hours{position:relative}
.cal-hours span{position:absolute;right:6px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);transform:translateY(-50%)}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hourpx)}
.cal-col.off{background-color:color-mix(in srgb,var(--surface2) 55%,transparent)}
.cal-col .work{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--blue-soft) 35%,transparent);pointer-events:none}
.blk{position:absolute;border-radius:8px;padding:4px 7px;font-size:.76rem;line-height:1.25;overflow:hidden;cursor:grab;border-left:3px solid;box-shadow:var(--shadow);touch-action:none;user-select:none}
.blk b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .mono{font-size:.68rem;opacity:.8}
.blk.ev{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.blk.task{background:var(--surface);border-color:var(--teal);color:var(--ink);border-style:dashed solid dashed solid;border-width:1px 1px 1px 3px}
.blk.task.risk{border-left-color:var(--bad)}
.blk.done{opacity:.45;text-decoration:line-through}
.blk.dragging{opacity:.85;z-index:20;cursor:grabbing;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.cal-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tray{display:flex;flex-direction:column;gap:6px}
.tray-item{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-size:.88rem}
.tray-item .grow{flex:1;min-width:0;overflow-wrap:anywhere}

/* Focus */
.focus-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.ring{position:relative;width:min(300px,80vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .time{font-family:var(--f-display);font-size:3.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Habits */
.habit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.week{display:flex;gap:5px}
.hday{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.68rem;color:var(--muted);display:grid;place-items:center;padding:0;font-weight:600}
.hday.on{background:var(--teal);border-color:var(--teal);color:#fff}
.hday.today{outline:2px solid var(--blue);outline-offset:1px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--surface2);display:block}
.heat i.l1{background:color-mix(in srgb,var(--teal) 35%,var(--surface2))}
.heat i.l2{background:color-mix(in srgb,var(--teal) 65%,var(--surface2))}
.heat i.l3{background:var(--teal)}

/* Stats */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .d{font-size:.8rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.hbar{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;font-size:.85rem;margin:6px 0}
.hbar .track{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:99px}
.insight{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:.9rem;align-items:flex-start}
.insight .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-weight:700;font-size:.75rem;color:#fff}

/* Review */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px}
.step.on{background:var(--teal-soft);border-color:transparent}
.step .check{margin-top:1px}
textarea,.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px}
textarea{min-height:110px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.switch{display:flex;align-items:center;gap:10px;font-size:.9rem}
.switch input{width:18px;height:18px;accent-color:var(--blue)}
.daypick{display:flex;gap:5px;flex-wrap:wrap}
.daypick button{width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;font-weight:600}
.daypick button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(5,14,28,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-h{display:flex;align-items:center;gap:10px}
.modal-h .grow{flex:1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.palette{width:min(600px,100%);padding:0;gap:0;align-self:start;margin-top:10vh}
.palette input{border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1.05rem;width:100%;background:transparent;border-radius:0}
.palette input:focus{outline:none}
.pal-list{max-height:50vh;overflow:auto;padding:6px}
.pal-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer}
.pal-item.on,.pal-item:hover{background:var(--blue-soft)}
.pal-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);z-index:45;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow:auto;display:flex;flex-direction:column;gap:14px}
.alert-item{display:flex;gap:10px;padding:10px;border-radius:10px;background:var(--surface2);font-size:.88rem}
.alert-item .ic{width:8px;border-radius:4px;flex:none}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;animation:pop .25s ease-out}
.toast.alert{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--amber)}
.toast .row{display:flex;gap:6px;flex-wrap:wrap}
.toast .btn{color:var(--ink);background:var(--surface);border-color:var(--line)}
.toast .btn.ghost{color:inherit;background:transparent;border-color:transparent;opacity:.75}
.toast.alert .btn.ghost{color:var(--muted)}
.toast b{font-family:var(--f-display)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:12px}

@media (max-width:1000px){.g-today,.focus-grid{grid-template-columns:1fr}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;min-width:0;width:100%;flex-direction:row;align-items:center;padding:10px 0;gap:10px;z-index:30;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .brand{flex:none}
  .nav{flex:1 1 0;min-width:0;width:0;flex-direction:row;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--rail)}
  .brand small,.rail-foot,.nav a .k{display:none}
  .brand b{font-size:1rem}
  .nav a{padding:7px 10px;font-size:.85rem;white-space:nowrap;flex:none}
  .nav a svg{display:none}
  .g-2,.matrix{grid-template-columns:1fr}
  .hbar{grid-template-columns:90px 1fr 48px}
  h1{font-size:1.5rem}
  .search{display:none}
  .tl-item{grid-template-columns:62px 4px 1fr auto}
}
</style>

</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><b>Thrustline</b><small>by ValueBridge</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">Works offline · data stays on this device<br><span class="mono">v1.0.2</span></div>
  </aside>
  <main class="main"><div class="wrap" id="wrap">
    <div class="topbar">
      <button class="search" id="openPal" aria-label="Search and commands"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span style="flex:1;text-align:left">Search tasks or run a command</span><kbd>Ctrl K</kbd></button>
      <div class="grow"></div>
      <button class="btn" data-act="newEvent"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Event</button>
      <button class="btn primary" data-act="newTask"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Task</button>
      <button class="iconbtn" data-act="openAlerts" aria-label="Alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="alertBadge" hidden>0</span></button>
    </div>
    <div id="view"></div>
  </div></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="overlay"></div>

<script>
"use strict";
const APP={name:"ValueBridge Thrustline",version:"1.0.2",built:"2026-11-13",support:"support@valuebridgeja.com",page:"https://valuebridgeja.com/products/thrustline.html",trial:true};
/* ============ Utilities ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>iso(new Date());
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const dow=s=>parseISO(s).getDay();
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYS_L=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmtT(m){if(m==null)return"";m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mi=m%60;
  if(S().h24)return`${pad(h)}:${pad(mi)}`;const ap=h<12?"AM":"PM";const hh=h%12||12;return mi?`${hh}:${pad(mi)} ${ap}`:`${hh} ${ap}`}
function fmtDur(m){m=Math.round(m);if(m<60)return m+"m";const h=Math.floor(m/60),r=m%60;return r?`${h}h ${r}m`:`${h}h`}
function fmtDate(s,long){if(!s)return"";const t=todayISO(),d=dayDiff(t,s);if(d===0)return"Today";if(d===1)return"Tomorrow";if(d===-1)return"Yesterday";
  const D=parseISO(s);if(d>1&&d<7)return long?DAYS_L[D.getDay()]:DAYS[D.getDay()];return`${DAYS[D.getDay()]} ${D.getDate()} ${MONTHS[D.getMonth()]}`}
const ceil15=m=>Math.ceil(m/15)*15;

/* ============ State ============ */
const KEY=APP.trial?"vb-thrustline-trial":"vb-thrustline-v1";
let state;
const S=()=>state.settings;
function defaults(){return{settings:{workStart:540,workEnd:1050,workDays:[1,2,3,4,5],lunch:true,lunchStart:720,lunchLen:60,buffer:10,peak:"morning",maxDeep:240,reserve:20,learnEst:true,remind:10,sound:true,dayBrief:true,shutdown:true,focusLen:25,shortBreak:5,longBreak:15,autoBreak:true,h24:false,name:""},
  projects:[],tasks:[],events:[],habits:[],sessions:[],fired:{},alertLog:[],reviews:{},big3:{},parking:[],example:false,lastPlan:null}}
const STORE=(()=>{try{return APP.trial?sessionStorage:localStorage}catch(e){return null}})();
function load(){try{const raw=STORE&&STORE.getItem(KEY);if(raw){const d=JSON.parse(raw);const base=defaults();state={...base,...d,settings:{...base.settings,...d.settings}};return}}catch(e){}
  state=defaults();seed()}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{STORE&&STORE.setItem(KEY,JSON.stringify(state))}catch(e){}},150)}

/* Example data, dated relative to today */
function seed(){
  const t=todayISO(),P=(name,color)=>{const p={id:uid(),name,color};state.projects.push(p);return p.id};
  const pL=P("ValueBridge launch","#0067DB"),pC=P("Client work","#00957F"),pP=P("Personal","#6A3DF0"),pA=P("Admin","#B86E00");
  const T=(o)=>state.tasks.push({id:uid(),title:"",notes:"",project:null,pri:3,due:null,dueTime:null,est:30,energy:"med",tags:[],recur:null,done:false,doneAt:null,sched:null,remind:null,subs:[],actual:0,created:t,...o});
  T({title:"Finish product listing copy for Thrustline",project:pL,pri:1,due:t,est:60,energy:"high",subs:[{t:"Feature list",d:true},{t:"Comparison table",d:false},{t:"Screenshots",d:false}]});
  T({title:"Send revised audit proposal to client",project:pC,pri:1,due:addDays(t,1),dueTime:900,est:45,energy:"high",remind:30});
  T({title:"Move DNS to Cloudflare",project:pL,pri:2,due:addDays(t,2),est:40,energy:"med"});
  T({title:"Reconcile October expenses",project:pA,pri:2,due:addDays(t,-1),est:50,energy:"low"});
  T({title:"Draft newsletter: 5 time-blocking tips",project:pL,pri:3,due:addDays(t,4),est:90,energy:"high"});
  T({title:"Prepare slides for Tuesday workshop",project:pC,pri:2,due:addDays(t,3),est:120,energy:"high"});
  T({title:"Book dentist appointment",project:pP,pri:3,est:10,energy:"low"});
  T({title:"Reply to supplier emails",project:pA,pri:3,due:t,est:25,energy:"low",recur:"weekdays"});
  T({title:"Plan family weekend",project:pP,pri:4,due:addDays(t,1),est:20,energy:"low"});
  T({title:"Record 90-second demo video",project:pL,pri:2,due:addDays(t,6),est:75,energy:"high"});
  T({title:"Update invoice template",project:pA,pri:4,est:30,energy:"low"});
  // completed history for estimate learning
  [[pC,"Site visit report",60,82],[pL,"Write PDF Studio README",45,55],[pA,"File receipts",20,18],[pC,"Client kickoff notes",30,41],[pL,"Logo variants",60,75],[pP,"Car service booking",15,15]].forEach(([p,ti,e,a],i)=>
    T({title:ti,project:p,est:e,actual:a,done:true,doneAt:addDays(t,-(i+1)),due:addDays(t,-(i+1))}));
  const E=o=>state.events.push({id:uid(),title:"",date:t,start:540,end:600,color:"blue",remind:10,recur:null,loc:"",...o});
  E({title:"Team stand-up",start:555,end:570,recur:"weekdays",date:addDays(t,-14)});
  E({title:"Client call: Kestrel Bay",start:660,end:705,loc:"Zoom",remind:15});
  E({title:"Lunch with Maya",date:addDays(t,1),start:750,end:840,color:"purple",loc:"Devon House"});
  E({title:"Gym",start:1110,end:1170,recur:"weekly",date:addDays(t,-dow(t)+1),color:"teal"});
  E({title:"Weekly review",start:960,end:990,recur:"weekly",date:addDays(t,5-dow(t)-7),color:"purple"});
  E({title:"Workshop: time management",date:addDays(t,4),start:600,end:720,color:"amber",loc:"Kingston"});
  let r=7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
  const H=(name,target,p)=>{const h={id:uid(),name,target,log:{}};for(let i=1;i<84;i++)if(rnd()<p)h.log[addDays(t,-i)]=true;state.habits.push(h)};
  H("Read 20 minutes",7,.7);H("Exercise",4,.5);H("Plan tomorrow before 6 PM",5,.75);H("No phone in the first hour",7,.45);
  for(let i=1;i<=13;i++){const d=addDays(t,-i);if([0,6].includes(dow(d))&&rnd()<.6)continue;const n=1+Math.floor(rnd()*5);for(let k=0;k<n;k++)state.sessions.push({date:d,min:25,taskId:null,start:540+k*35})}
  state.example=true;
}

/* ============ Recurrence & queries ============ */
function occursOn(ev,d){if(!ev.recur)return ev.date===d;if(d<ev.date)return false;if(ev.until&&d>ev.until)return false;const w=dow(d);
  switch(ev.recur){case"daily":return true;case"weekdays":return w>=1&&w<=5;case"weekly":return w===dow(ev.date);case"biweekly":return w===dow(ev.date)&&(dayDiff(ev.date,d)/7)%2===0;case"monthly":return parseISO(d).getDate()===parseISO(ev.date).getDate();default:return false}}
const eventsOn=d=>state.events.filter(e=>occursOn(e,d)&&!(e.skip||[]).includes(d)).map(e=>({...e,occ:d})).sort((a,b)=>a.start-b.start);
const schedOn=d=>state.tasks.filter(t=>t.sched&&t.sched.date===d).sort((a,b)=>a.sched.start-b.sched.start);
const proj=id=>state.projects.find(p=>p.id===id);
const task=id=>state.tasks.find(t=>t.id===id);
const open=()=>state.tasks.filter(t=>!t.done);
function nextRecur(d,r){const w=dow(d);switch(r){case"daily":return addDays(d,1);case"weekdays":return addDays(d,w===5?3:w===6?2:1);case"weekly":return addDays(d,7);case"biweekly":return addDays(d,14);case"monthly":{const D=parseISO(d);D.setMonth(D.getMonth()+1);return iso(D)}}return null}
const EVC={blue:"var(--blue)",teal:"var(--teal)",purple:"var(--purple)",amber:"var(--amber)",bad:"var(--bad)"};

/* Learned estimate factor from completed tasks with tracked time */
function estFactor(){const xs=state.tasks.filter(t=>t.done&&t.actual>0&&t.est>0);if(xs.length<3)return{f:1,n:xs.length};
  const sa=xs.reduce((s,t)=>s+t.actual,0),se=xs.reduce((s,t)=>s+t.est,0);return{f:clamp(sa/se,.7,1.8),n:xs.length}}

/* Capacity: free working minutes vs planned minutes */
function capacity(d){const s=S();if(!s.workDays.includes(dow(d)))return{avail:0,planned:schedOn(d).filter(t=>!t.done).reduce((a,t)=>a+planEst(t),0),meet:0,off:true};
  let busy=[];eventsOn(d).forEach(e=>busy.push([Math.max(e.start,s.workStart),Math.min(e.end,s.workEnd)]));
  if(s.lunch)busy.push([s.lunchStart,s.lunchStart+s.lunchLen]);
  busy=merge(busy.filter(b=>b[1]>b[0]));const blocked=busy.reduce((a,b)=>a+b[1]-b[0],0);
  const meet=eventsOn(d).reduce((a,e)=>a+Math.max(0,Math.min(e.end,s.workEnd)-Math.max(e.start,s.workStart)),0);
  const avail=Math.max(0,s.workEnd-s.workStart-blocked);
  const planned=schedOn(d).filter(t=>!t.done).reduce((a,t)=>a+planEst(t),0)+open().filter(t=>!t.sched&&t.due===d).reduce((a,t)=>a+planEst(t),0);
  return{avail,planned,meet,off:false}}
function merge(iv){iv=iv.slice().sort((a,b)=>a[0]-b[0]);const out=[];for(const x of iv){if(out.length&&x[0]<=out[out.length-1][1])out[out.length-1][1]=Math.max(out[out.length-1][1],x[1]);else out.push([...x])}return out}

/* ============ Smart planner ============ */
function freeSlots(d,ignore){const s=S();let start=s.workStart;const end=s.workEnd;

  const b=s.buffer;let busy=eventsOn(d).map(e=>[e.start-b,e.end+b]);
  if(s.lunch)busy.push([s.lunchStart,s.lunchStart+s.lunchLen]);
  schedOn(d).forEach(t=>{if(t.id!==ignore&&!t.done)busy.push([t.sched.start,t.sched.start+planEst(t)+b])});
  busy=merge(busy);const free=[];let cur=start;
  for(const[x,y]of busy){if(y<=cur)continue;if(x>cur)free.push([cur,Math.min(x,end)]);cur=Math.max(cur,y);if(cur>=end)break}
  if(cur<end)free.push([cur,end]);return free.filter(f=>f[1]-f[0]>=15)}
function peakWin(){const s=S();const mid=s.lunch?s.lunchStart:Math.round((s.workStart+s.workEnd)/2);return s.peak==="afternoon"?[mid,s.workEnd]:[s.workStart,mid]}
function priorityScore(t){const today=todayISO();const dd=t.due?dayDiff(today,t.due):30;return(dd<0?-50+dd:dd*10)+t.pri*9+(t.est>90?2:0)}
function placeTask(t,days,load){const len=planEst(t);const s=S();const [pw0,pw1]=peakWin();
  for(const d of days){const used=load[d]||{min:0,deep:0};const cap=capacity(d);const limit=cap.avail*(1-s.reserve/100);
    if(used.min+len>limit&&used.min>0)continue;if(t.energy==="high"&&used.deep+len>s.maxDeep)continue;
    const slots=freeSlots(d,t.id);
    const tryWin=(w0,w1)=>{for(const[a,b]of slots){const st=Math.max(a,w0),en=Math.min(b,w1);if(en-st>=len)return ceil15(st)+len<=en?ceil15(st):st}return null};
    let st=null;if(t.energy==="high")st=tryWin(pw0,pw1);else if(t.energy==="low"){st=t.energy==="low"&&s.peak==="morning"?tryWin(pw1,s.workEnd):tryWin(s.workStart,pw0)}
    if(st==null)st=tryWin(0,1440);
    if(st!=null){t.sched={date:d,start:st,auto:true};used.min+=len;if(t.energy==="high")used.deep+=len;load[d]=used;return d}}
  return null}
function autoPlan(range){const today=todayISO();const s=S();const days=[];for(let i=0;i<(range||7);i++){const d=addDays(today,i);if(s.workDays.includes(dow(d)))days.push(d)}
  const undo=state.tasks.map(t=>[t.id,t.sched?{...t.sched}:null]);
  const nm=nowMin();const cands=open().filter(t=>{if(!t.sched)return true;if(t.sched.locked)return false;if(t.sched.date<today)return true;if(t.sched.date===today&&t.sched.start+planEst(t)<nm)return true;return t.sched.auto&&days.includes(t.sched.date)});
  cands.forEach(t=>t.sched=null);
  cands.sort((a,b)=>priorityScore(a)-priorityScore(b));
  const load={};days.forEach(d=>{const m=schedOn(d).filter(t=>!t.done).reduce((a,t)=>a+planEst(t),0);const deep=schedOn(d).filter(t=>!t.done&&t.energy==="high").reduce((a,t)=>a+planEst(t),0);load[d]={min:m,deep}});
  const res={placed:0,risk:[],nofit:[],skipped:0};
  for(const t of cands){const horizonOK=t.due||t.pri<=3;if(!horizonOK){res.skipped++;continue}
    const d=placeTask(t,days,load);if(d){res.placed++;if(t.due&&d>t.due)res.risk.push(t)}else res.nofit.push(t)}

function undoPlan(){if(!state.lastPlan)return;const m=new Map(state.lastPlan.undo);state.tasks.forEach(t=>{if(m.has(t.id))t.sched=m.get(t.id)});state.lastPlan=null;save();render();toast("Plan undone")}
function scheduleOne(t){const today=todayISO();const days=[];for(let i=0;i<14;i++){const d=addDays(today,i);if(S().workDays.includes(dow(d)))days.push(d)}
  const load={};const d=placeTask(t,days,load);save();return d}

/* ============ Natural-language quick add ============ */

function parseQuick(input){let s=" "+input+" ";const out={title:"",pri:null,project:null,projectNew:null,due:null,dueTime:null,est:null,energy:null,recur:null,remind:null,tags:[]};const today=todayISO();

  take(/\s@(high|deep|med|medium|low|light)(?=\s)/i,(_,e)=>{e=e.toLowerCase();out.energy=e==="deep"||e==="high"?"high":e==="low"||e==="light"?"low":"med"});

  take(/\s(?:remind(?:\s+me)?|\^)\s*(\d+)\s*(m|min|mins|h|hr)?(?=\s)/i,(_,n,u)=>{out.remind=+n*(u&&u[0].toLowerCase()==="h"?60:1)});

  take(/\snext\s+week(?=\s)/i,()=>{out.due=addDays(today,(8-dow(today))%7||7)});
  take(/\sin\s+(\d+)\s+(days?|weeks?)(?=\s)/i,(_,n,u)=>{out.due=addDays(today,+n*(u[0]==="w"?7:1))});
  take(/\s(?:on\s+|by\s+|next\s+)?(sun|sunday|mon|monday|tue|tues|tuesday|wed|wednesday|thu|thur|thurs|thursday|fri|friday|sat|saturday)(?=\s)/i,(_,w)=>{let n=(WD[w.toLowerCase()]-dow(today)+7)%7;if(n===0)n=7;out.due=addDays(today,n)});
  take(/\s(?:on\s+|by\s+)?(jan\w*|feb\w*|mar\w*|apr\w*|may|jun\w*|jul\w*|aug\w*|sep\w*|oct\w*|nov\w*|dec\w*)\s+(\d{1,2})(?:st|nd|rd|th)?(?=\s)/i,(_,mo,d)=>{const k=mo.toLowerCase();const mi=MO[k]??MO[k.slice(0,3)];if(mi==null)return false;const y=new Date().getFullYear();let D=new Date(y,mi,+d);if(iso(D)<today)D=new Date(y+1,mi,+d);out.due=iso(D)});

  if(out.dueTime!=null&&!out.due)out.due=today;
  out.title=s.replace(/\s+/g," ").trim();return out}
function chipsFor(p){const c=[];if(p.due)c.push(`<span class="chip blue">${fmtDate(p.due)}${p.dueTime!=null?" · "+fmtT(p.dueTime):""}</span>`);
  if(p.est)c.push(`<span class="chip">${fmtDur(p.est)}</span>`);if(p.pri)c.push(`<span class="chip ${p.pri===1?"bad":p.pri===2?"amber":"blue"}">P${p.pri}</span>`);
  if(p.project)c.push(`<span class="chip"><i class="dot" style="background:${proj(p.project).color}"></i>${esc(proj(p.project).name)}</span>`);

  if(t.done&&t.recur){const base=t.due||todayISO();const n={...t,id:uid(),done:false,doneAt:null,actual:0,due:nextRecur(base,t.recur),sched:t.sched&&t.sched.locked?{...t.sched,date:nextRecur(t.sched.date,t.recur)}:null,subs:t.subs.map(s=>({...s,d:false}))};state.tasks.push(n);t.recur=null}

let actx=null;
function chime(kind){if(!S().sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const notes=kind==="done"?[660,880]:kind==="end"?[523,659,784]:[784,988,784];

function upcomingAlerts(hours){const out=[];const t=todayISO();const nm=nowMin();const horizon=nm+(hours||24)*60;
  for(let k=0;k<2;k++){const d=addDays(t,k);const off=k*1440;
    eventsOn(d).forEach(e=>{if(e.remind==null)return;const at=e.start-e.remind+off;out.push({key:`e:${e.id}:${d}:${e.start}`,at,kind:"event",title:e.title,body:`${e.remind?`Starts in ${e.remind} min`:"Starting now"} · ${fmtT(e.start)}–${fmtT(e.end)}${e.loc?" · "+e.loc:""}`,start:e.start+off,color:EVC[e.color]||"var(--blue)",ref:e.id})});
    schedOn(d).forEach(x=>{if(x.done)return;const r=x.remind??(S().remind);const at=x.sched.start-r+off;out.push({key:`t:${x.id}:${d}:${x.sched.start}`,at,kind:"task",title:x.title,body:`Planned block ${fmtT(x.sched.start)} · ${fmtDur(planEst(x))}`,start:x.sched.start+off,color:"var(--teal)",ref:x.id})});
    if(S().dayBrief&&S().workDays.includes(dow(d))){out.push({key:`brief:${d}`,at:S().workStart-15+off,kind:"brief",title:"Your day at a glance",body:dayBriefText(d),start:S().workStart+off,color:"var(--purple)"})}
    if(S().shutdown&&S().workDays.includes(dow(d))){out.push({key:`shut:${d}`,at:S().workEnd-15+off,kind:"shutdown",title:"Shutdown ritual in 15 minutes",body:"Close loops, move unfinished tasks and pick tomorrow’s Big 3.",start:S().workEnd+off,color:"var(--purple)"})}}
  (state.snoozed||[]).forEach(z=>out.push({...z}));
  return out.filter(a=>a.at<=horizon).sort((a,b)=>a.at-b.at)}
function dayBriefText(d){const ev=eventsOn(d).length,ts=schedOn(d).filter(t=>!t.done).length,od=open().filter(t=>t.due&&t.due<d).length;const c=capacity(d);
  return`${ev} event${ev===1?"":"s"}, ${ts} planned task${ts===1?"":"s"}${od?`, ${od} overdue`:""}. ${c.planned>c.avail?`Over capacity by ${fmtDur(c.planned-c.avail)}.`:`${fmtDur(Math.max(0,c.avail-c.planned))} still free.`}`}
function checkAlerts(){const nm=nowMin();const t=todayISO();
  const snz=(state.snoozed||[]);
  upcomingAlerts(1).forEach(a=>{if(state.fired[a.key])return;if(a.at>nm)return;if(nm>a.start+20&&!a.snooze)return;
    state.fired[a.key]=t;fireAlert(a)});
  state.snoozed=snz.filter(z=>!state.fired[z.key]);
  // prune old fired keys
  for(const k in state.fired)if(state.fired[k]<addDays(t,-3))delete state.fired[k];
  save();updateBadge()}
function fireAlert(a){chime("alert");state.alertLog.unshift({title:a.title,body:a.body,when:Date.now(),color:a.color});state.alertLog=state.alertLog.slice(0,40);state.unread=(state.unread||0)+1;
  try{if("Notification"in window&&Notification.permission==="granted")new Notification(a.title,{body:a.body,tag:a.key})}catch(e){}
  flashTitle(a.title);
  const acts=[{l:"Snooze 5 min",f:()=>snooze(a,5)},{l:"Snooze 15",f:()=>snooze(a,15)}];
  if(a.kind==="task")acts.unshift({l:"Start focus",f:()=>{focus.taskId=a.ref;location.hash="focus";startFocus()}});
  if(a.kind==="shutdown")acts.unshift({l:"Open review",f:()=>{location.hash="review"}});
  toast(`<b>${esc(a.title)}</b><span>${esc(a.body)}</span>`,acts,{alert:true,sticky:true})}
function snooze(a,m){state.snoozed=state.snoozed||[];const at=nowMin()+m;state.snoozed.push({...a,key:a.key.split("~")[0]+"~"+at,at,start:at,snooze:true,title:a.title,body:a.body});save();toast(`Snoozed for ${m} minutes`)}

   ${p?`<span class="chip"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}</span>`:""}
   ${t.due?`<span class="chip ${od?"bad":t.due===today?"blue":""}">${od?"Overdue · ":""}${fmtDate(t.due)}${t.dueTime!=null?" "+fmtT(t.dueTime):""}</span>`:""}

function quickAdd(id){return`<div class="qa"><div class="qa-row"><input id="${id}" placeholder="Add a task: “Send proposal tomorrow 3pm 45m !1 #client”" autocomplete="off" aria-label="Quick add task"><button class="btn primary" data-act="qaAdd" data-for="${id}">Add</button></div><div class="chips" id="${id}-chips"><span class="muted" style="font-size:.78rem">Type naturally. Dates, times, durations (45m, 1.5h), !1–!4, #project, @deep, “every Monday”, “remind 15”.</span></div></div>`}

    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn teal" data-act="planWeek">Plan my week</button><button class="btn" data-act="planToday">Plan today</button>${state.lastPlan?`<button class="btn ghost" data-act="undoPlan">Undo last plan</button>`:""}</div></div></section>
  <div class="card">${quickAdd("qaToday")}</div>

   </div>
   <div class="stack">
    <div class="card"><div class="card-h"><h2 class="grow">Big 3 for today</h2><span class="muted" style="font-size:.8rem">${b3.filter(x=>x.done).length}/${b3.length||3} done</span></div>

let tFilter="active",tProj="",tMode="list";
function vTasks(){const t=todayISO();let xs=state.tasks.slice();
  if(tProj)xs=xs.filter(x=>tProj==="inbox"?!x.project:x.project===tProj);
  if(tFilter==="active")xs=xs.filter(x=>!x.done);else if(tFilter==="today")xs=xs.filter(x=>!x.done&&x.due&&x.due<=t);else if(tFilter==="upcoming")xs=xs.filter(x=>!x.done&&x.due&&x.due>t&&x.due<=addDays(t,7));else if(tFilter==="unsched")xs=xs.filter(x=>!x.done&&!x.sched);else if(tFilter==="done")xs=xs.filter(x=>x.done).sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
  if(tFilter!=="done")xs.sort((a,b)=>priorityScore(a)-priorityScore(b));
  const groups=[["Overdue",x=>x.due&&x.due<t],["Today",x=>x.due===t],["Tomorrow",x=>x.due===addDays(t,1)],["Next 7 days",x=>x.due&&x.due>addDays(t,1)&&x.due<=addDays(t,7)],["Later",x=>x.due&&x.due>addDays(t,7)],["No due date",x=>!x.due]];
  let body="";
  if(tMode==="matrix"&&tFilter!=="done"){const urgent=x=>x.due&&dayDiff(t,x.due)<=2,imp=x=>x.pri<=2;const Q=[["q1","Do now","Urgent and important",x=>urgent(x)&&imp(x)],["q2","Schedule","Important, not urgent",x=>!urgent(x)&&imp(x)],["q3","Delegate or batch","Urgent, less important",x=>urgent(x)&&!imp(x)],["q4","Drop or defer","Neither",x=>!urgent(x)&&!imp(x)]];
    body=`<div class="matrix">${Q.map(([c,h,s,f])=>{const ys=xs.filter(f);return`<div class="quad ${c}"><h3>${h}<span class="chip">${ys.length}</span></h3><div class="muted" style="font-size:.8rem;margin-bottom:6px">${s}</div>${ys.map(y=>taskRow(y)).join("")||`<div class="muted" style="font-size:.85rem">Nothing here.</div>`}</div>`}).join("")}</div>`}
  else if(tFilter==="done")body=xs.map(x=>taskRow(x)).join("")||`<div class="empty">Nothing completed yet.</div>`;
  else{groups.forEach(([h,f])=>{const ys=xs.filter(f);if(!ys.length)return;const mins=ys.reduce((a,y)=>a+y.est,0);body+=`<div class="group-h"><h3>${h}</h3><span class="muted mono" style="font-size:.75rem">${ys.length} · ${fmtDur(mins)}</span></div>${ys.map(y=>taskRow(y)).join("")}`});if(!body)body=`<div class="empty">No tasks match. Add one above.</div>`}
  const tab=(k,l)=>`<button class="tab ${tFilter===k?"on":""}" data-act="tFilter" data-k="${k}">${l}</button>`;

/* ============ Render & routing ============ */
function render(){renderNav();const v={today:vToday,tasks:vTasks,calendar:vCalendar,focus:vFocus,habits:vHabits,insights:vInsights,review:vReview,prefs:vPrefs}[view]||vToday;
  $("#view").innerHTML=`<div class="wrap" style="gap:18px">${trialBanner()+""}${v()}</div>`;if(view==="calendar")bindCalendar();bindView()}
function bindView(){$$(".qa input").forEach(inp=>{const chips=$("#"+inp.id+"-chips");const def=chips.innerHTML;
  inp.addEventListener("input",()=>{const v=inp.value.trim();chips.innerHTML=v?chipsFor(parseQuick(v))||'<span class="muted" style="font-size:.78rem">No date yet. It goes to your list.</span>':def});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&inp.value.trim()){addFromQuick(inp.value);}})});
  const ft=$("#fTask");if(ft)ft.onchange=()=>{focus.taskId=ft.value||null;render()};
  const fa=$("#fAuto");if(fa)fa.onchange=()=>{S().autoBreak=fa.checked;save()};
  const pi=$("#parkIn");if(pi)pi.onkeydown=e=>{if(e.key==="Enter")act("park")};
  const rn=$("#rvNotes");if(rn)rn.oninput=()=>{const key=rvMode==="daily"?todayISO():"w"+weekStart(todayISO());state.reviews[key]=state.reviews[key]||{c:[],n:""};state.reviews[key].n=rn.value;save()};
  const bp=$("#b3pick");if(bp)bp.onchange=()=>{const tom=addDays(todayISO(),1);state.big3[tom]=[...(state.big3[tom]||[]),bp.value].slice(0,3);save();render()};
  if(view==="prefs"){const map={sName:["name","s"],sWS:["workStart","n"],sWE:["workEnd","n"],sLS:["lunchStart","n"],sLL:["lunchLen","n"],sH24:["h24","b01"],sPeak:["peak","s"],sBuf:["buffer","n"],sRes:["reserve","n"],sDeep:["maxDeep","n"],sRem:["remind","n"],sFL:["focusLen","n"],sSB:["shortBreak","n"],sLB:["longBreak","n"],sLunch:["lunch","c"],sLearn:["learnEst","c"],sSound:["sound","c"],sBrief:["dayBrief","c"],sShut:["shutdown","c"]};
    Object.entries(map).forEach(([id,[k,ty]])=>{const el=$("#"+id);if(!el)return;el.addEventListener("change",()=>{const s=S();s[k]=ty==="n"?+el.value:ty==="c"?el.checked:ty==="b01"?el.value==="1":el.value;
      if(s.workEnd<=s.workStart+60){s.workEnd=s.workStart+60;toast("Work must end at least an hour after it starts")}save();if(["h24","workStart","workEnd"].includes(k))render();else toast("Saved")})})}}
function route(){const h=location.hash.slice(1);view=VIEWS.some(v=>v[0]===h)?h:"today";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

/* ============ Actions ============ */
function planReport(r){const parts=[`Planned ${r.placed} task${r.placed===1?"":"s"}`];if(r.risk.length)parts.push(`${r.risk.length} after the due date`);if(r.nofit.length)parts.push(`${r.nofit.length} didn’t fit`);
  toast(`<b>${parts.join(" · ")}</b>${r.nofit.length?`<span>Didn’t fit: ${r.nofit.slice(0,3).map(t=>esc(t.title)).join(", ")}. Split them into smaller tasks or free up time.</span>`:r.risk.length?`<span>At risk: ${r.risk.slice(0,3).map(t=>esc(t.title)).join(", ")}. Consider moving a meeting or the deadline.</span>`:"<span>Your calendar now has a block for each task.</span>"}`,[{l:"Undo",f:undoPlan},{l:"View week",f:()=>{calStart=null;location.hash="calendar"}}])}
function act(a,el){const id=el&&el.dataset.id;switch(a){
  case"newTask":return editTask();case"newEvent":return editEvent();case"edit":return editTask(id);case"editEv":return editEvent(id,el.dataset.occ);case"toggle":return toggleTask(id);case"close":return closeOverlay();
  case"qaAdd":{const i=$("#"+el.dataset.for);if(i.value.trim())addFromQuick(i.value);return}
  case"schedOne":{const t=task(id);if(t.sched)t.sched=null;const d=scheduleOne(t);render();toast(d?`Scheduled ${fmtDate(d)} at ${fmtT(t.sched.start)}`:"No free slot in the next 2 weeks. Try a shorter estimate.");return}
  case"planWeek":{const r=autoPlan(7);render();planReport(r);return}case"planToday":{const r=autoPlan(1);render();planReport(r);return}case"undoPlan":return undoPlan();
  case"rollover":{const t=todayISO();const nm=nowMin();let n=0;open().forEach(x=>{if((x.due&&x.due<t)||(x.sched&&(x.sched.date<t||(x.sched.date===t&&x.sched.start+planEst(x)<nm)))){x.sched=null;n++}});const r=autoPlan(7);render();toast(`Moved ${n} unfinished task${n===1?"":"s"}. ${r.placed} now have new slots.`,[{l:"Undo",f:undoPlan}]);return}
  case"addBig3":{const t=todayISO();state.big3[t]=[...(state.big3[t]||[]),id].slice(0,3);save();render();return}
  case"focusTask":focus.taskId=id;focus.mode="focus";focus.left=null;location.hash="focus";return;
  case"habit":{const h=state.habits.find(x=>x.id===id);const d=el.dataset.d;if(h.log[d])delete h.log[d];else{h.log[d]=true;chime("done")}save();render();return}
  case"newHabit":overlay(`<div class="modal-h"><h2 class="grow">New habit</h2><button class="btn ghost sm" data-act="close">Close</button></div><label class="field"><span>Habit</span><input id="hN" placeholder="Walk 20 minutes" autofocus></label><label class="field"><span>Days per week</span><select id="hT">${[1,2,3,4,5,6,7].map(n=>`<option ${n===5?"selected":""}>${n}</option>`).join("")}</select></label><div class="modal-f"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="hS">Add habit</button></div>`);
    $("#hS").onclick=()=>{const n=$("#hN").value.trim();if(!n)return;state.habits.push({id:uid(),name:n,target:+$("#hT").value,log:{}});save();closeOverlay();render()};return;
  case"delHabit":return confirmBox("Remove this habit and its history?","Remove",()=>{state.habits=state.habits.filter(h=>h.id!==id);save();render()});
  case"newProject":overlay(`<div class="modal-h"><h2 class="grow">New project</h2><button class="btn ghost sm" data-act="close">Close</button></div><label class="field"><span>Name</span><input id="pN" autofocus placeholder="Website redesign"></label><label class="field"><span>Colour</span><select id="pC"><option value="#0067DB">Blue</option><option value="#00957F">Teal</option><option value="#6A3DF0">Purple</option><option value="#B86E00">Amber</option><option value="#C93434">Red</option></select></label><div class="modal-f"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="pS">Create</button></div>`);
    $("#pS").onclick=()=>{const n=$("#pN").value.trim();if(!n)return;state.projects.push({id:uid(),name:n,color:$("#pC").value});save();closeOverlay();render()};return;
  case"tFilter":tFilter=el.dataset.k;return render();case"tProj":tProj=el.dataset.k;return render();case"tMode":tMode=el.dataset.k;return render();
  case"calPrev":calStart=addDays(calStart,window.innerWidth<720?-1:-7);return render();case"calNext":calStart=addDays(calStart,window.innerWidth<720?1:7);return render();case"calToday":calStart=null;return render();
  case"fStart":return startFocus();case"fPause":return pauseFocus();case"fReset":return resetFocus();case"fSkip":return finishFocus(true);
  case"fMode":if(focus.running)pauseFocus();focus.mode=el.dataset.k;focus.left=null;return render();
  case"park":{const i=$("#parkIn");if(i&&i.value.trim()){state.parking.unshift(i.value.trim());save();render();setTimeout(()=>$("#parkIn")&&$("#parkIn").focus(),0)}return}
  case"parkDel":state.parking.splice(+el.dataset.i,1);save();return render();
  case"parkTask":{const txt=state.parking.splice(+el.dataset.i,1)[0];addFromQuick(txt);return}
  case"rvMode":rvMode=el.dataset.k;return render();
  case"rvCheck":{const key=rvMode==="daily"?todayISO():"w"+weekStart(todayISO());const r=state.reviews[key]=state.reviews[key]||{c:[],n:""};const i=+el.dataset.i;r.c=r.c.includes(i)?r.c.filter(x=>x!==i):[...r.c,i];save();return render()}
  case"wday":{const d=+el.dataset.d;const s=S();s.workDays=s.workDays.includes(d)?s.workDays.filter(x=>x!==d):[...s.workDays,d];save();return render()}
  case"askNotify":try{if(!("Notification"in window)){toast("This browser doesn’t support desktop notifications");return}Notification.requestPermission().then(p=>{toast(p==="granted"?"Desktop notifications are on":"Notifications weren’t allowed here. In-app alerts still work.");render()}).catch(()=>toast("Notifications aren’t available in this view. In-app alerts still work."))}catch(e){toast("Notifications aren’t available in this view.")}return;
  case"testAlert":fireAlert({key:"test:"+Date.now(),kind:"event",title:"Test alert",body:"This is how Thrustline will remind you.",color:"var(--amber)"});updateBadge();return;
  case"openAlerts":return openAlerts();
  case"copySupport":return copyText(APP.support);

  case"clearExample":return confirmBox("Clear all example tasks, events, habits and history?","Clear examples",()=>{const s=state.settings;state=defaults();state.settings=s;save();render();toast("Examples cleared. Your fresh start is ready.")});
  case"loadExample":{const s=state.settings;state=defaults();state.settings=s;seed();save();render();return}
  case"resetAll":return confirmBox("Erase all tasks, events, habits, settings and history on this device?","Erase everything",()=>{state=defaults();save();render();toast("Everything erased")});
}}

function openAlerts(){state.unread=0;updateBadge();save();const nm=nowMin();const up=upcomingAlerts(24).filter(a=>a.at>nm&&!state.fired[a.key]);
  $("#overlay").innerHTML=`<div class="scrim" data-scrim style="place-items:stretch"></div><aside class="drawer" role="dialog" aria-label="Alert centre"><div class="modal-h"><h2 class="grow">Alert centre</h2><button class="btn ghost sm" data-act="close">Close</button></div>
  <div class="label">Coming up (24 hours)</div>${up.map(a=>`<div class="alert-item"><span class="ic" style="background:${a.color}"></span><div style="min-width:0"><b>${esc(a.title)}</b><div class="muted" style="font-size:.8rem">${esc(a.body)}</div><div class="mono muted" style="font-size:.72rem;margin-top:2px">Alert at ${fmtT(a.at)}${a.at>=1440?" tomorrow":""}</div></div></div>`).join("")||`<div class="empty">Nothing scheduled.</div>`}
  <div class="label">Recent</div>${state.alertLog.slice(0,12).map(a=>`<div class="alert-item"><span class="ic" style="background:${a.color||"var(--amber)"}"></span><div style="min-width:0"><b>${esc(a.title)}</b><div class="muted" style="font-size:.8rem">${esc(a.body)}</div><div class="mono muted" style="font-size:.72rem">${new Date(a.when).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})}</div></div></div>`).join("")||`<div class="muted" style="font-size:.88rem">No alerts yet.</div>`}
  <button class="btn" data-act="testAlert">Send a test alert</button></aside>`}

/* Command palette */
function openPalette(){const cmds=[["Plan my week","planWeek"],["Plan today","planToday"],["New task","newTask"],["New event","newEvent"],["Start focus timer","fStart"],["Move overdue tasks to free slots","rollover"],["Open alert centre","openAlerts"],["Help and licence","go:prefs"],...VIEWS.map(([k,l])=>["Go to "+l,"go:"+k])];
  overlay(`<input id="palIn" placeholder="Search tasks or type a command…" autofocus aria-label="Command"><div class="pal-list" id="palList"></div>`,"palette");let sel=0,items=[];
  const draw=()=>{const q=$("#palIn").value.toLowerCase().trim();items=[...cmds.filter(c=>!q||c[0].toLowerCase().includes(q)).map(c=>({l:c[0],k:"cmd",a:c[1]})),...(q?state.tasks.filter(t=>t.title.toLowerCase().includes(q)).slice(0,8).map(t=>({l:t.title,k:t.done?"done task":"task",id:t.id})):[])];
    if(q&&!items.length)items=[{l:`Add task “${q}”`,k:"new",q:$("#palIn").value}];sel=Math.min(sel,items.length-1);
    $("#palList").innerHTML=items.map((it,i)=>`<div class="pal-item ${i===sel?"on":""}" data-i="${i}"><span class="grow">${esc(it.l)}</span><span class="chip">${it.k}</span></div>`).join("")};
  const run=it=>{closeOverlay();if(!it)return;if(it.k==="new")addFromQuick(it.q);else if(it.id)editTask(it.id);else if(it.a.startsWith("go:"))location.hash=it.a.slice(3);else if(it.a==="fStart"){location.hash="focus";startFocus()}else act(it.a,{dataset:{}})};
  $("#palIn").oninput=()=>{sel=0;draw()};$("#palIn").onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(items.length-1,sel+1);draw();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==="Enter")run(items[sel])};
  $("#palList").onclick=e=>{const it=e.target.closest(".pal-item");if(it)run(items[+it.dataset.i])};draw()}

/* Global events */
document.addEventListener("click",e=>{const scrim=e.target.matches("[data-scrim]");if(scrim){closeOverlay();return}
  const b=e.target.closest("[data-act]");if(b){e.preventDefault();act(b.dataset.act,b)}});
$("#openPal").onclick=openPalette;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return}
  if(e.key==="Escape"){closeOverlay();return}
  if(e.target.matches("input,textarea,select")||$("#overlay").innerHTML||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();if(k==="n"){e.preventDefault();editTask()}else if(k==="e"){e.preventDefault();editEvent()}else if(k==="q"){const i=$(".qa input");if(i){e.preventDefault();i.focus()}}else if(k==="p")act("planWeek");else if(k==="f"){if(view!=="focus")location.hash="focus";else focus.running?pauseFocus():startFocus()}
  else if(/^[1-8]$/.test(k))location.hash=VIEWS[+k-1][0]});
let lastW=window.innerWidth;window.addEventListener("resize",()=>{if(view==="calendar"&&(window.innerWidth<720)!==(lastW<720)){calStart=null;render()}lastW=window.innerWidth});

/* Boot */
load();route();updateBadge();
setInterval(()=>{checkAlerts();if(view==="today"&&!$("#overlay").innerHTML&&!document.activeElement.matches("input,textarea"))render()},20000);
setTimeout(checkAlerts,1500);
</script>
